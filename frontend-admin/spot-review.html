<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理后台 - 景点审核</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/admin.css">
    <style>
        .review-card{background:#fff;border-radius:8px;border:1px solid #e8e8e8;padding:20px;margin-bottom:14px;transition:box-shadow .2s}
        .review-card:hover{box-shadow:0 4px 16px rgba(0,0,0,.08)}
        .review-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
        .review-name{font-weight:600;font-size:15px}
        .review-meta{font-size:12px;color:#888;margin-bottom:10px;display:flex;gap:12px;flex-wrap:wrap}
        .review-diff{font-size:13px;color:#555;line-height:1.7;background:#fafafa;border-radius:6px;padding:10px 14px;margin-bottom:8px;display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center}
        .review-diff .old{color:#999;text-decoration:line-through}
        .review-diff .new{color:#52c41a;font-weight:500}
        .review-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
        .status-badge{padding:3px 10px;border-radius:12px;font-size:12px;font-weight:600}
        .st-PENDING{background:#fff7e6;color:#d48806}
        .st-APPROVED{background:#f6ffed;color:#52c41a}
        .st-REJECTED{background:#fff1f0;color:#ff4d4f}
        .filter-bar{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
        .filter-bar select{padding:7px 12px;border:1px solid #d9d9d9;border-radius:6px;font-size:13px}
        .badge-count{background:#ff4d4f;color:#fff;border-radius:10px;padding:1px 8px;font-size:11px;margin-left:6px}
    </style>
</head>
<body>
<div class="admin-layout">
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header"><i class="fas fa-flag"></i> 管理后台</div>
        <nav class="sidebar-nav">
            <a href="index.html"><i class="fas fa-tachometer-alt"></i> 仪表盘</a>
            <a href="users.html"><i class="fas fa-users"></i> 用户管理</a>
            <a href="spots.html"><i class="fas fa-map-marker-alt"></i> 景点管理</a>
            <a href="routes.html"><i class="fas fa-route"></i> 线路管理</a>
            <a href="culture.html"><i class="fas fa-book"></i> 文化管理</a>
            <a href="hotels.html"><i class="fas fa-hotel"></i> 酒店管理</a>
            <a href="foods.html"><i class="fas fa-utensils"></i> 美食管理</a>
            <a href="comments.html"><i class="fas fa-comments"></i> 留言管理</a>
            <a href="orders.html"><i class="fas fa-shopping-cart"></i> 订单管理</a>
            <a href="faqs.html"><i class="fas fa-question-circle"></i> FAQ管理</a>
            <div style="border-top:1px solid rgba(255,255,255,.12);margin:8px 12px"></div>
            <a href="feedbacks.html"><i class="fas fa-bullhorn"></i> 问题反馈</a>
            <a href="route-review.html"><i class="fas fa-clipboard-check"></i> 线路审核</a>
            <a href="spot-review.html" class="active"><i class="fas fa-search-plus"></i> 景点审核</a>
            <a href="permissions.html"><i class="fas fa-shield-alt"></i> 权限配置</a>
            <a href="customer-service.html"><i class="fas fa-headset"></i> 人工客服</a>
        </nav>
    </aside>
    <div class="main-content">
        <header class="top-bar">
            <button class="menu-toggle" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
            <h1>景点审核 <span id="pendingBadge" class="badge-count" style="display:none"></span></h1>
            <div class="top-bar-right"><span id="adminName"></span> <a href="#" onclick="doLogout()">退出</a></div>
        </header>
        <div class="content">
            <div class="card">
                <div class="card-header">
                    <h2>景点更正审核</h2>
                    <span style="font-size:12px;color:#888">用户提交的景点信息更正建议</span>
                </div>
                <div class="filter-bar">
                    <select id="statusFilter" onchange="load(1)">
                        <option value="PENDING" selected>待审核</option>
                        <option value="APPROVED">已通过</option>
                        <option value="REJECTED">已驳回</option>
                        <option value="">全部</option>
                    </select>
                    <button class="btn btn-primary btn-sm" onclick="load(currentPage)"><i class="fas fa-sync"></i> 刷新</button>
                </div>
                <div id="listWrap"><div class="loading"><i class="fas fa-spinner fa-spin"></i></div></div>
                <div class="pagination" id="pagination"></div>
            </div>
        </div>
    </div>
</div>

<div class="modal-overlay" id="rejectModal" style="display:none">
    <div class="modal" style="max-width:440px;padding:28px">
        <div style="font-size:16px;font-weight:600;margin-bottom:16px">驳回更正建议</div>
        <input type="hidden" id="rejectId">
        <div class="form-group">
            <label>驳回原因（必填）</label>
            <textarea id="rejectReason" style="width:100%;padding:10px;border:1px solid #d9d9d9;border-radius:6px;height:90px;resize:vertical;font-size:13px" placeholder="请输入驳回原因…"></textarea>
        </div>
        <div style="display:flex;gap:10px;margin-top:16px;justify-content:flex-end">
            <button class="btn btn-default" onclick="closeReject()">取消</button>
            <button class="btn btn-danger" onclick="doReject()">驳回</button>
        </div>
    </div>
</div>

<script src="js/admin-common.js"></script>
<script>
if (!requireAdmin()) throw '';
renderSidebar();

let currentPage = 1;

const FIELD_LABELS = {name:'景点名称',description:'景点描述',location:'地址',region:'所属地区',theme:'内容分类',openTime:'开放时间',ticketPrice:'门票价格',trafficInfo:'交通信息',longitude:'地图经度',latitude:'地图纬度',ticketReservation:'门票预约',suggestedDuration:'建议停留',itemsToBring:'随身物品提醒'};
function fieldLabel(f) { return FIELD_LABELS[f] || f || ''; }

async function load(page) {
    currentPage = page || currentPage;
    const status = document.getElementById('statusFilter').value;
    const data = await api(`/api/admin/spotSuggestion/list?page=${currentPage}&size=15&status=${encodeURIComponent(status)}`);
    if (!data) return;

    const cnt = await api('/api/admin/spotSuggestion/pendingCount');
    const badge = document.getElementById('pendingBadge');
    if (cnt > 0) { badge.textContent = cnt; badge.style.display = 'inline'; } else badge.style.display = 'none';

    const wrap = document.getElementById('listWrap');
    const records = data.records || [];
    const totalPages = data.pages || Math.ceil((data.total || 0) / 15) || 1;

    if (!records.length) {
        wrap.innerHTML = '<div class="empty-state"><p>暂无记录</p></div>';
        document.getElementById('pagination').innerHTML = '';
        return;
    }

    wrap.innerHTML = records.map(r => {
        const statusLabel = {PENDING:'待审核',APPROVED:'已通过',REJECTED:'已驳回'}[r.status] || r.status || '待审核';
        return `<div class="review-card">
            <div class="review-header">
                <div class="review-name">${escHtml(r.spotName || '景点')} · ${escHtml(fieldLabel(r.fieldName))}</div>
                <span class="status-badge st-${r.status||'PENDING'}">${statusLabel}</span>
            </div>
            <div class="review-meta">
                <span><i class="fas fa-user"></i> ${escHtml(r.username||'--')}</span>
                <span><i class="fas fa-clock"></i> ${formatDate(r.createTime)}</span>
            </div>
            <div class="review-diff">
                <span class="old">${escHtml(r.oldValue || '-')}</span>
                <span><i class="fas fa-arrow-right"></i></span>
                <span class="new">${escHtml(r.newValue || '-')}</span>
            </div>
            ${r.reason ? `<div style="font-size:12px;color:#666;margin-bottom:8px"><i class="fas fa-comment-dots"></i> 用户说明：${escHtml(r.reason)}</div>` : ''}
            ${r.rejectReason ? `<div style="font-size:12px;color:#ff4d4f"><i class="fas fa-times-circle"></i> 驳回原因：${escHtml(r.rejectReason)}</div>` : ''}
            ${r.status === 'PENDING' ? `
            <div class="review-actions">
                <button class="btn btn-danger btn-sm" onclick="openReject(${r.id})"><i class="fas fa-times"></i> 驳回</button>
                <button class="btn btn-success btn-sm" onclick="doApprove(${r.id})"><i class="fas fa-check"></i> 通过</button>
            </div>` : ''}
        </div>`;
    }).join('');

    renderPagination('pagination', currentPage, totalPages, 'load');
}

async function doApprove(id) {
    showConfirm('确定通过该更正建议并应用到景点信息？', async () => {
        const res = await api(`/api/admin/spotSuggestion/approve?id=${id}`);
        if (res !== null) { showToast('已通过'); load(currentPage); }
    });
}

function openReject(id) {
    document.getElementById('rejectId').value = id;
    document.getElementById('rejectReason').value = '';
    document.getElementById('rejectModal').style.display = 'flex';
}
function closeReject() { document.getElementById('rejectModal').style.display = 'none'; }

async function doReject() {
    const id = document.getElementById('rejectId').value;
    const reason = document.getElementById('rejectReason').value.trim();
    if (!reason) { showToast('请输入驳回原因', 'error'); return; }
    const res = await api(`/api/admin/spotSuggestion/reject?id=${id}&reason=${encodeURIComponent(reason)}`);
    if (res !== null) { closeReject(); showToast('已驳回'); load(currentPage); }
}

load(1);
</script>
</body>
</html>
